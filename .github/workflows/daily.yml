name: daily price check

on:
  schedule:
    - cron: '50 1 * * *'   # 09:50 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest -v

      - name: Fetch, match, render, notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker run --save-raw build/raw.html

      - name: Upload raw HTML (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: build/raw.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash
          git push
